---
kind: pipeline
type: docker
name: Build ARM

platform:
  os: linux
  arch: arm64
    
steps:
  - name: Ubuntu 20.04
    image: ubuntu:focal
    volumes:
      - name: debs
        path: /tmp/hestiacp-src/
    commands:
    - ln -snf /usr/share/zoneinfo/CET /etc/localtime && echo CET > /etc/timezone
    - ./src/hst_autocompile.sh --hestia --noinstall --keepbuild --debug '~localsrc'
    - mkdir /tmp/hestiacp-src/ubuntu-2004/
    - mv /tmp/hestiacp-src/deb/*.deb /tmp/hestiacp-src/ubuntu-2004/
    - rm -fr /tmp/hestiacp-src/deb/
    
  - name: scp files
    image: appleboy/drone-scp
    settings:
      host:
        - dev.eris.nu
      user: root
      key:
        from_secret: ssh_key
      port: 22
      command_timeout: 2m
      target: /root/
      source:
        - debs/*/*.deb

volumes:
  - name: debs
    temp: {}