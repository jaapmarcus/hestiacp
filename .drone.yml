---
kind: pipeline
type: docker
name: Build ARM

platform:
  os: linux
  arch: arm64
    
steps:
  - name: Ubuntu 20.04
    image: ubuntu:focal
    commands:
    - ln -snf /usr/share/zoneinfo/CET /etc/localtime && echo CET > /etc/timezone
    - ./src/hst_autocompile.sh --hestia --noinstall --keepbuild --debug '~localsrc'
    - mkdir -p ./packages/arm/ubuntu-2004
    - mv /tmp/hestiacp-src/deb/*.deb ./packages/arm/ubuntu-2004
    
  - name: scp files
    image: appleboy/drone-scp
    settings:
      host:
        - dev.eris.nu
      user: root
      key:
        from_secret: ssh_key
      port: 22
      command_timeout: 2m
      target: /root/
      source:
        - /packages/*
