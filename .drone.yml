---
kind: pipeline
type: docker
name: Build ARM

platform:
  os: linux
  arch: arm64
    
steps:
  - name: Ubuntu 20.04
    image: ubuntu:focal
    volumes:
      - name: debs
        path: /tmp/hestia-src
    commands:
    - ln -snf /usr/share/zoneinfo/CET /etc/localtime && echo CET > /etc/timezone
    - ./src/hst_autocompile.sh --all --noinstall --keepbuild --debug '~localsrc'

volumes:
  - name: debs
    host:
      path: /tmp/hesita-src/